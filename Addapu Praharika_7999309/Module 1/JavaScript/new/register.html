<!-- Task: Registration Form -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        h1{
            text-align: center;
            color: red;
        }

        .registration-form{
            width: 400px;
            margin: 20px auto;
            background-color: white;
            padding: 20px;
            border: 1px solid lightgray;
        }

        label{
            display: block;
            margin-top: 10px;
        }

        input,
        select,
        textarea{
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }

        button{
            margin-top: 15px;
            padding: 10px 20px;
            background-color: powderblue;
            border: none;
            cursor: pointer;
        }

    </style>

</head>

<body>

    <h1>Registration Form</h1>

    <form class="registration-form">

        <label>Name:</label>
        <input type="text" id="name" required>

        <label>Email:</label>
        <input type="email" id="email" required>

        <label>Phone:</label>
        <input type="text" id="phone" onblur="validatePhone()">

        <label>Select Event:</label>

        <select id="eventType" onchange="showFee()">

            <option value="">Select Event</option>
            <option value="100">Music Festival</option>
            <option value="150">Food Carnival</option>
            <option value="200">Art Workshop</option>

        </select>

        <p id="fee"></p>

        <label>Message:</label>

        <textarea
            id="message"
            rows="4"
            onkeyup="countCharacters()">
        </textarea>

        <p id="charCount">
            Characters: 0
        </p>

        <button
            type="button"
            onclick="submitForm()">

            Register

        </button>

    </form>

    <script src="main.js"></script>

</body>

</html>
